name: Backend CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rag_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: valkey/valkey:8.1-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-password@localhost:5432/rag_platform
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
      - run: pip install -r requirements-dev.txt
      - run: pip install --dry-run -r requirements-training.txt
      - run: python -m compileall app alembic tests training
      - run: alembic upgrade head
      - run: PGPASSWORD=ci-password psql -h localhost -U postgres -d rag_platform -tAc "SELECT 1 FROM pg_indexes WHERE schemaname = 'public' AND indexname = 'uq_memberships_user_org_orglevel'" | grep -qx 1
      - run: python -m pytest -v
      - run: git diff --check
      - run: cp .env.example .env
      - run: docker compose --env-file .env.example config
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: docker build --build-arg VITE_BUILD_SHA=${GITHUB_SHA} -t modai-web-console-ci ./frontend
