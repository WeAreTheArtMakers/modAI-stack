name: Backend CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rag_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-password@localhost:5432/rag_platform
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m compileall app alembic tests training
      - run: alembic upgrade head
      - run: python -m pytest -v
      - run: git diff --check
      - run: cp .env.example .env
      - run: docker compose --env-file .env.example config
