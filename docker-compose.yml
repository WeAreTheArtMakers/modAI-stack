services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      # API Docker içinde çalışırken servis isimlerini kullanır.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"

      # Ollama Mac üzerinde çalışıyor.
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    restart: unless-stopped


  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Mac'te 5432 başka PostgreSQL tarafından kullanılıyor.
    # Bu proje host tarafında 55432 kullanacak.
    ports:
      - "55432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  qdrant:
    image: qdrant/qdrant:v1.12.5

    ports:
      - "6333:6333"

    volumes:
      - qdrantdata:/qdrant/storage

    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


volumes:
  pgdata:
  qdrantdata:
