services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [postgres, redis, qdrant]
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: rag_platform, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
volumes: {pgdata: {}, qdrantdata: {}}
