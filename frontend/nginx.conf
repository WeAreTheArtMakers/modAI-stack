server {
  listen 80;
  server_name _;

  # Docker service IPs can change after Compose restarts. Resolve the API
  # service per request instead of pinning its address when Nginx starts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $api_host api;

  # microphone=(self): the voice assistant may ask for the microphone on this origin only.
  # 'wasm-unsafe-eval' lets the browser compile the self-hosted ONNX Runtime WebAssembly;
  # it does not allow JavaScript eval.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'" always;

  # Host carries the port the browser used ($http_host, not $host): the API compares the Origin of
  # cookie requests (refresh, logout) with scheme://Host, and http://localhost:5183 must match.
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_host:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ws/ {
    proxy_pass http://$api_host:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 3600s;
  }

  # Revision-pinned voice models: never fall back to index.html for a missing file.
  # (expires, not add_header, so the server-level security headers still apply.)
  location /voice-models/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    expires 30d;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    expires 1y;
  }

  location = /index.html {
    root /usr/share/nginx/html;
    expires -1;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
